# Claudio backend configuration.
# Copy to config.yaml (cp config.example.yaml config.yaml) and edit.
# Every value can also be overridden by env var: CLAUDIO__SECTION__KEY
# e.g. CLAUDIO__LLM__MODEL="gpt-5"  CLAUDIO__SERVER__AUTH_TOKEN="..."

server:
  host: 127.0.0.1          # restart-required
  port: 8100               # restart-required
  auth_token: "dev-token-change-me"   # REQUIRED for non-loopback binds; hot-reloadable
  cors_origins:            # hot-reloadable
    - "http://localhost:5173"

llm:                       # hot-reloadable (applies to next run)
  provider: openai
  # Local dev model (LM Studio). For OpenAI: model: gpt-5, base_url: null
  model: "qwen3.5-4b-claude-4.6-opus-reasoning-distilled"
  api_key: "local"
  base_url: "http://127.0.0.1:1234/v1"
  temperature: 0.2
  max_tokens: 4096
  fallback_model: null
  timeout_seconds: 120
  retry_attempts: 3
  # Approximate price per million tokens (USD) for budget tracking.
  price_input_per_mtok: 0.0
  price_output_per_mtok: 0.0

agent:
  name: claudio
  instructions_file: instructions.md   # relative to this config dir; or inline `instructions:`
  max_turns: 50
  max_budget_usd: 5.0
  approval_mode: on_request            # off | on_request | always
  workspace_dir: ./data/workspace
  context_window: 32768              # used for compaction threshold math
  compaction_reserve: 8192           # tokens reserved (summary + answer room)
  max_output_chars: 8000             # per-tool output clip
  strict_tools: false                  # strict JSON-schema tool mode (off for local models)
  tools:
    enabled:
      - read_file
      - write_file
      - edit_file
      - list_dir
      - run_command
      - web_fetch
      - web_search
      - todo_write
    disabled: []
  subagents:
    explorer:
      description: "Read-only code/file explorer; returns a report only"
      instructions_file: agents/explorer.md
      tools: [read_file, list_dir, web_fetch]
      max_turns: 30

mcp:                       # agent-restart-required (connections)
  servers: []
  #  - id: filesystem
  #    transport: stdio
  #    command: ["npx", "-y", "@modelcontextprotocol/server-filesystem", "/srv/data"]
  #    enabled: true

monitoring:
  log_level: INFO            # hot-reloadable
  log_retention_days: 7
  metrics_snapshot_interval_seconds: 5

# Autonomous daemon. report_only: true means the daemon only observes and reports
# — it never mutates the system. Configure via this file or the cockpit Autonomous
# view; never from the chat box.
autonomous:
  enabled: false             # master switch for the daemon
  report_only: true          # safe default; flip to false only when you trust it
  health_check:
    enabled: true
    interval_minutes: 10
    disk_warn_percent: 85.0
    disk_crit_percent: 95.0
    mem_crit_percent: 95.0
    swap_warn_percent: 80.0
    load_warn_factor: 1.0    # warning when load1 > cores * this
    load_crit_factor: 2.0    # critical when load1 > cores * this
    backup_path: ""          # directory to check for backup freshness
    backup_max_age_hours: 26.0
  # Scheduled maintenance (spec §8). Safe actions run automatically; the
  # irreversible ones (autoremove, full_upgrade, docker_prune) are always routed
  # through the suggestion/accept flow regardless of these toggles.
  maintenance:
    enabled: false           # enable in Phase 2
    schedule: "0 3 * * *"   # cron, evaluated in UTC
    vacuum_size: "200M"      # journalctl --vacuum-size value
    temp_dirs: ["/tmp", "/var/tmp"]
    audit_retention_days: 90
    apt_update: true
    vacuum_logs: true
    temp_cleanup: true
    autoremove: true         # irreversible -> proposed as a suggestion
    full_upgrade: false      # irreversible -> proposed as a suggestion
    docker_prune: false      # irreversible -> proposed as a suggestion
  # Boot-time disaster recovery (spec §9). Safe, reversible actions only.
  recovery:
    enabled: false           # enable in Phase 3
    expected_services: []    # units that must be running after boot
    restart_allowlist: []    # units the daemon may restart (mirror in sudoers)
  # Positive allowlist of exact elevated commands. When omitted, the built-in
  # defaults are used. Set this to override; each entry is validated at load.
  # command_allowlist:
  #   - "/usr/bin/apt-get update"
  #   - "/usr/bin/journalctl --vacuum-size=200M"
  notification:
    enabled: false
    email:
      enabled: false
      smtp_host: ""
      smtp_port: 587
      username: ""
      password: ""           # redacted in API responses
      from_addr: ""
      to_addr: ""
      use_tls: true
    webhook:
      enabled: false
      url: ""                # generic webhook; POSTs JSON on WARNING/CRITICAL
