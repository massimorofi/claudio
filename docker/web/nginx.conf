# claudio-web — nginx main config.
#
# NOTE: this is a complete top-level config (it declares events{} and http{}),
# so it replaces /etc/nginx/nginx.conf. It must NOT be dropped into
# conf.d/default.conf — that file is included from inside http{}, and an
# events{} block there is a parse error.

user  nginx;
worker_processes auto;

pid /tmp/nginx.pid;

error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
             application/xml image/svg+xml;

    # Writable scratch so nginx never needs the root filesystem.
    client_body_temp_path /tmp/nginx_client_body;
    proxy_temp_path       /tmp/nginx_proxy;
    fastcgi_temp_path   /tmp/nginx_fastcgi;
    uwsgi_temp_path     /tmp/nginx_uwsgi;
    scgi_temp_path      /tmp/nginx_scgi;

    upstream claudio_agent {
        server claudio-agent:8100;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # --- API -> agent ----------------------------------------------------
        location /api/ {
            proxy_pass         http://claudio_agent;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # SSE: Claudio streams agent output over a POST SSE connection.
            # Buffering here makes the UI look frozen until the turn ends.
            proxy_buffering         off;
            proxy_cache             off;
            proxy_request_buffering off;
            # Empty Connection header keeps the upstream connection reusable
            # (HTTP/1.1) instead of close-on-each-request.
            proxy_set_header   Connection        "";
            proxy_set_header   X-Accel-Buffering no;

            # Long turns: the agent can be silent for minutes between tool calls.
            proxy_connect_timeout 10s;
            proxy_send_timeout    3600s;
            proxy_read_timeout    3600s;

            client_max_body_size 50m;
        }

        # Direct liveness passthrough for external probes.
        location = /healthz {
            proxy_pass http://claudio_agent/healthz;
            proxy_http_version 1.1;
            proxy_buffering off;
            access_log off;
        }

        # FastAPI interactive docs (handy for debugging the deployed API).
        location ~ ^/(docs|openapi.json)$ {
            proxy_pass http://claudio_agent;
            proxy_http_version 1.1;
            proxy_buffering off;
        }

        # --- static assets ---------------------------------------------------
        # Vite fingerprints these filenames, so they are safe to cache hard.
        location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?|map)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # --- SPA -------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
